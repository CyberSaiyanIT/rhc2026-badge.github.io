name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - name: Build
        env:
          PUBLIC_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # base_url looks like https://user.github.io/repo (or https://user.github.io for user sites)
          SITE_URL="$(echo "${{ steps.pages.outputs.origin }}")"
          BASE_PATH="$(echo "${{ steps.pages.outputs.base_path }}")"
          export SITE_URL BASE_PATH="${BASE_PATH:-/}"
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
